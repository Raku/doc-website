name: Build Current Website Container

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # The build context is the repo root (Website/Dockerfile COPYs .), so
    # almost any change is relevant; only skip New_Website-specific ones.
    paths-ignore:
      - 'New_Website/**'
      - '.github/workflows/build-docker-new.yml'
  schedule:
    # every 8 hours
    - cron: '0 0,8,16 * * *'

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.REGISTRY_RW_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.REGISTRY_RW_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build and push container
        run: ./scripts/cibuild.sh container
